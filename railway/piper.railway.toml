# Railway service config — piper-tts (private only)
# Dockerfile path: services/piper-tts/Dockerfile
# Root directory: repository root
# Do not attach a public domain.
# Voices baked by default (DOWNLOAD_VOICES=true, pinned PIPER_VOICES_REVISION).

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/piper-tts/Dockerfile"
watchPatterns = [
  "services/piper-tts/**",
  "railway/piper.railway.toml"
]

[deploy]
healthcheckPath = "/info"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
