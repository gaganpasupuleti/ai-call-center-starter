# Railway service config — piper-tts (private only)
# Root directory in Railway UI/API: /services/piper-tts
# Dockerfile: Dockerfile (within that root)
# Do not attach a public domain.
# Voices baked by default (DOWNLOAD_VOICES=true, pinned PIPER_VOICES_REVISION).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/**"
]

[deploy]
healthcheckPath = "/info"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
