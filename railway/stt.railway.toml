# Railway service config — speech-to-text (private only)
# Root directory in Railway UI/API: /services/speech-to-text
# Dockerfile: Dockerfile (within that root)
# Do not attach a public domain.
# Models are baked by default (DOWNLOAD_MODELS=true in Dockerfile).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/**"
]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
