<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Ops · Call Centre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="admin-topnav" aria-label="Admin">
        <div class="admin-topnav-inner">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M8 8h8v8H8z" />
                <path d="M4 4h4v4H4zM16 4h4v4h-4zM4 16h4v4H4zM16 16h4v4h-4z" />
              </svg>
            </div>
            <div class="brand-copy">
              <span class="brand-title">Voice Ops</span>
              <span class="brand-sub">Call Centre Admin</span>
            </div>
          </div>

          <label class="nav-select-wrap">
            <span class="sr-only">Workspace section</span>
            <select id="nav-select" aria-label="Workspace sections">
              <option value="dashboard">Dashboard</option>
              <option value="leads">Leads</option>
              <option value="campaigns">Campaigns</option>
              <option value="calls">Calls</option>
              <option value="outbound">Outbound</option>
              <option value="call-station">Live Calls</option>
              <option value="follow-ups">Follow-ups</option>
              <option value="settings">Settings</option>
            </select>
          </label>

          <div class="pill-track" role="tablist" aria-label="Workspace sections">
            <a href="#/dashboard" data-route="dashboard" role="tab">Dashboard</a>
            <a href="#/leads" data-route="leads" role="tab">Leads</a>
            <a href="#/campaigns" data-route="campaigns" role="tab">Campaigns</a>
            <a href="#/calls" data-route="calls" role="tab">Calls</a>
            <a href="#/outbound" data-route="outbound" role="tab">Outbound</a>
            <a href="#/call-station" data-route="call-station" role="tab">Live Calls</a>
            <a href="#/follow-ups" data-route="follow-ups" role="tab">Follow-ups</a>
            <a href="#/settings" data-route="settings" role="tab">Settings</a>
          </div>

          <div class="topnav-end">
            <span class="provider-pill" id="provider-pill">Provider…</span>
            <button type="button" class="secondary" id="refresh-btn">Refresh</button>
          </div>
        </div>
      </nav>

      <div class="main-column">
        <header class="page-hero">
          <div>
            <p class="page-eyebrow" id="page-eyebrow">Operations</p>
            <h2 id="page-title">Dashboard</h2>
          </div>
        </header>
        <div id="notice" class="notice" hidden role="status"></div>
        <main id="page-root" class="page-root" aria-live="polite"></main>
      </div>
    </div>
    <dialog id="modal" class="modal">
      <form method="dialog" id="modal-form">
        <header>
          <h3 id="modal-title">Details</h3>
          <button type="submit" class="secondary" value="cancel" aria-label="Close">Close</button>
        </header>
        <div id="modal-body"></div>
      </form>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
